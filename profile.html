<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>โปรไฟล์นักศึกษา</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    .profile-frame { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="profileFrame" class="profile-frame" title="ระบบโปรไฟล์นักศึกษา"
          allow="clipboard-read; clipboard-write; camera; microphone"
          allowfullscreen></iframe>

  <script src="profile-config.js?v=20260821-1"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const rollno = String(params.get('rollno') || sessionStorage.getItem('SSS_PROFILE_ROLLNO') || '')
        .replace(/\D/g, '').slice(0, 10);
      const webAppUrl = String(window.STUDENT_PROFILE_WEB_APP_URL || '').trim();
      const frame = document.getElementById('profileFrame');
      if (!rollno || !webAppUrl) {
        window.location.replace('index.html#studentServicesBox');
        return;
      }

      const target = new URL(webAppUrl);
      target.searchParams.set('rollno', rollno);
      target.searchParams.set('githubAutoLogin', '1');
      frame.src = target.toString();
    })();
  </script>
</body>
</html>
